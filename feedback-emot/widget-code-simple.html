<!-- 
  FEEDBACK EMOT - TAMPILAN SAJA (tanpa plugin)
  Copy kode ini ke Elementor → Custom HTML widget
-->

<style>
.feedback-emot-wrapper {
  max-width: 420px;
  margin: 20px auto;
  background: linear-gradient(165deg, #1a0533 0%, #0f0218 100%);
  border: 1px solid rgba(139, 92, 246, 0.3);
  border-radius: 24px;
  padding: 32px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(139, 92, 246, 0.1);
}

.feedback-emot-header {
  text-align: center;
  margin-bottom: 28px;
}

.feedback-emot-header h2 {
  color: #ffffff;
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 8px;
  margin-top: 0;
}

.feedback-emot-header p {
  color: rgba(255, 255, 255, 0.5);
  font-size: 13px;
  margin-bottom: 0;
}

.feedback-emot-emoji-row {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin-bottom: 24px;
}

.feedback-emot-emoji-btn {
  width: 72px;
  height: 72px;
  border-radius: 18px;
  border: 2px solid rgba(255, 255, 255, 0.08);
  background: rgba(255, 255, 255, 0.03);
  cursor: pointer;
  font-size: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
}

.feedback-emot-emoji-btn:hover {
  background: rgba(255, 255, 255, 0.08);
  transform: translateY(-4px);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
}

.feedback-emot-emoji-btn.selected {
  border-color: #8b5cf6;
  background: rgba(139, 92, 246, 0.2);
  box-shadow: 0 0 24px rgba(139, 92, 246, 0.3);
  transform: scale(1.08);
}

.feedback-emot-form-group {
  margin-bottom: 16px;
}

.feedback-emot-form-group label {
  display: block;
  color: rgba(255, 255, 255, 0.6);
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}

.feedback-emot-form-group input,
.feedback-emot-form-group textarea {
  width: 100%;
  padding: 14px 16px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 14px;
  color: #ffffff;
  font-size: 14px;
  outline: none;
  transition: all 0.3s ease;
  font-family: inherit;
  box-sizing: border-box;
}

.feedback-emot-form-group input:focus,
.feedback-emot-form-group textarea:focus {
  border-color: rgba(139, 92, 246, 0.5);
  background: rgba(255, 255, 255, 0.08);
  box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
}

.feedback-emot-form-group input::placeholder,
.feedback-emot-form-group textarea::placeholder {
  color: rgba(255, 255, 255, 0.3);
}

.feedback-emot-form-group textarea {
  min-height: 80px;
  resize: vertical;
}

.feedback-emot-submit-btn {
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
  border: none;
  border-radius: 16px;
  color: white;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  margin-top: 8px;
  box-shadow: 0 8px 24px rgba(139, 92, 246, 0.3);
}

.feedback-emot-submit-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 32px rgba(139, 92, 246, 0.4);
}

.feedback-emot-submit-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.feedback-emot-success {
  display: none;
  text-align: center;
  padding: 40px 20px;
}

.feedback-emot-success.show {
  display: block;
}

.feedback-emot-success-icon {
  font-size: 64px;
  margin-bottom: 16px;
}

.feedback-emot-success h3 {
  color: #4ade80;
  font-size: 20px;
  margin-bottom: 8px;
  margin-top: 0;
}

.feedback-emot-success p {
  color: rgba(255, 255, 255, 0.5);
  font-size: 14px;
}

.feedback-emot-spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-top-color: white;
  border-radius: 50%;
  animation: feedbackEmotSpin 0.6s linear infinite;
  margin-right: 8px;
  vertical-align: middle;
}

@keyframes feedbackEmotSpin {
  to { transform: rotate(360deg); }
}

@media (max-width: 480px) {
  .feedback-emot-wrapper {
    padding: 24px;
    border-radius: 20px;
  }
  
  .feedback-emot-emoji-btn {
    width: 64px;
    height: 64px;
    font-size: 32px;
  }
  
  .feedback-emot-emoji-row {
    gap: 12px;
  }
}
</style>

<div class="feedback-emot-wrapper">
  <!-- Form -->
  <div id="feedbackForm">
    <div class="feedback-emot-header">
      <h2>💬 Feedback Anda</h2>
      <p>Berikan feedback untuk pelayanan kami</p>
    </div>

    <div class="feedback-emot-emoji-row">
      <button class="feedback-emot-emoji-btn" data-emoji="😊" data-label="Senang" type="button">😊</button>
      <button class="feedback-emot-emoji-btn" data-emoji="😐" data-label="Biasa" type="button">😐</button>
      <button class="feedback-emot-emoji-btn" data-emoji="😢" data-label="Kecewa" type="button">😢</button>
    </div>

    <div class="feedback-emot-form-group">
      <label>Nama</label>
      <input type="text" id="feedbackNama" placeholder="Nama Anda (opsional)" />
    </div>

    <div class="feedback-emot-form-group">
      <label>Komentar</label>
      <textarea id="feedbackKomentar" placeholder="Tulis masukan atau saran Anda..."></textarea>
    </div>

    <button class="feedback-emot-submit-btn" id="feedbackSubmit" disabled>
      Kirim Feedback
    </button>
  </div>

  <!-- Success Message -->
  <div class="feedback-emot-success" id="feedbackSuccess">
    <div class="feedback-emot-success-icon">✅</div>
    <h3>Terima kasih!</h3>
    <p>Feedback Anda telah kami terima</p>
  </div>
</div>

<script>
(function() {
  'use strict';
  
  var emojiBtns = document.querySelectorAll('.feedback-emot-emoji-btn');
  var submitBtn = document.getElementById('feedbackSubmit');
  var namaInput = document.getElementById('feedbackNama');
  var feedbackForm = document.getElementById('feedbackForm');
  var feedbackSuccess = document.getElementById('feedbackSuccess');
  var selectedEmoji = null;
  var selectedLabel = null;

  // Emoji selection
  for (var i = 0; i < emojiBtns.length; i++) {
    emojiBtns[i].addEventListener('click', function() {
      for (var j = 0; j < emojiBtns.length; j++) {
        emojiBtns[j].classList.remove('selected');
      }
      this.classList.add('selected');
      selectedEmoji = this.dataset.emoji;
      selectedLabel = this.dataset.label;
      submitBtn.disabled = false;
    });
  }

  // Submit handler
  submitBtn.addEventListener('click', function() {
    if (!selectedEmoji) return;

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="feedback-emot-spinner"></span> Mengirim...';

    // Simulasi kirim (tanpa backend)
    setTimeout(function() {
      // Sembunyikan form
      feedbackForm.style.display = 'none';
      // Tampilkan success
      feedbackSuccess.classList.add('show');

      // Log ke console (untuk debug)
      console.log('Feedback diterima:', {
        emoji: selectedEmoji,
        label: selectedLabel,
        nama: namaInput.value.trim() || 'Anonim',
        komentar: document.getElementById('feedbackKomentar').value.trim()
      });
    }, 1500);
  });
})();
</script>
