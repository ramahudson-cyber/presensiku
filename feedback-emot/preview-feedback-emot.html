<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .feedback-container {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 24px;
    padding: 32px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(139, 92, 246, 0.15);
  }

  .feedback-header {
    text-align: center;
    margin-bottom: 28px;
  }

  .feedback-header h2 {
    color: white;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .feedback-header p {
    color: rgba(255, 255, 255, 0.5);
    font-size: 13px;
  }

  .emoji-row {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-bottom: 24px;
  }

  .emoji-btn {
    width: 72px;
    height: 72px;
    border-radius: 18px;
    border: 2px solid rgba(255, 255, 255, 0.08);
    background: rgba(255, 255, 255, 0.03);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    transition: all 0.3s ease;
    position: relative;
  }

  .emoji-btn:hover {
    background: rgba(255, 255, 255, 0.08);
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
  }

  .emoji-btn.selected {
    border-color: #8b5cf6;
    background: rgba(139, 92, 246, 0.2);
    box-shadow: 0 0 24px rgba(139, 92, 246, 0.3);
    transform: scale(1.08);
  }

  .emoji-labels {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-bottom: 24px;
  }

  .emoji-labels span {
    color: rgba(255, 255, 255, 0.4);
    font-size: 11px;
    text-align: center;
    width: 72px;
    transition: color 0.3s;
  }

  .emoji-labels span.active {
    color: #8b5cf6;
    font-weight: 600;
  }

  .form-group {
    margin-bottom: 16px;
  }

  .form-group label {
    display: block;
    color: rgba(255, 255, 255, 0.6);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }

  .form-group input,
  .form-group textarea {
    width: 100%;
    padding: 14px 16px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 14px;
    color: white;
    font-size: 14px;
    outline: none;
    transition: all 0.3s ease;
  }

  .form-group input:focus,
  .form-group textarea:focus {
    border-color: rgba(139, 92, 246, 0.5);
    background: rgba(255, 255, 255, 0.08);
    box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
  }

  .form-group input::placeholder,
  .form-group textarea::placeholder {
    color: rgba(255, 255, 255, 0.3);
  }

  .form-group textarea {
    min-height: 80px;
    resize: vertical;
    font-family: inherit;
  }

  .submit-btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
    border: none;
    border-radius: 16px;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 8px;
    box-shadow: 0 8px 24px rgba(139, 92, 246, 0.3);
  }

  .submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(139, 92, 246, 0.4);
  }

  .submit-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .message {
    padding: 14px 16px;
    border-radius: 14px;
    margin-top: 16px;
    font-size: 13px;
    font-weight: 500;
    display: none;
    text-align: center;
  }

  .message.success {
    background: rgba(34, 197, 94, 0.1);
    border: 1px solid rgba(34, 197, 94, 0.3);
    color: #4ade80;
    display: block;
  }

  .message.error {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #f87171;
    display: block;
  }

  .required-star {
    color: #ef4444;
    margin-left: 2px;
  }

  /* Loading spinner */
  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    margin-right: 8px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>

<div class="feedback-container">
  <div class="feedback-header">
    <h2>💬 Feedback Anda</h2>
    <p>Berikan feedback untuk pelayanan kami</p>
  </div>

  <!-- Emoji Selection -->
  <div class="emoji-row">
    <button class="emoji-btn" data-emoji="😊" data-label="Senang" type="button">😊</button>
    <button class="emoji-btn" data-emoji="😐" data-label="Biasa" type="button">😐</button>
    <button class="emoji-btn" data-emoji="😢" data-label="Kecewa" type="button">😢</button>
  </div>
  <div class="emoji-labels">
    <span>Senang</span>
    <span>Biasa</span>
    <span>Kecewa</span>
  </div>

  <!-- Name -->
  <div class="form-group">
    <label>Nama <span class="required-star">*</span></label>
    <input type="text" id="nama" placeholder="Nama Anda (opsional)" />
  </div>

  <!-- Comment -->
  <div class="form-group">
    <label>Komentar</label>
    <textarea id="komentar" placeholder="Tulis masukan atau saran Anda..."></textarea>
  </div>

  <!-- Submit -->
  <button class="submit-btn" id="submitBtn" disabled>
    Kirim Feedback
  </button>

  <!-- Message -->
  <div class="message" id="message"></div>
</div>

<script>
  const emojiBtns = document.querySelectorAll('.emoji-btn');
  const submitBtn = document.getElementById('submitBtn');
  const message = document.getElementById('message');
  let selectedEmoji = null;
  let selectedLabel = null;

  // Emoji click
  emojiBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      emojiBtns.forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedEmoji = btn.dataset.emoji;
      selectedLabel = btn.dataset.label;
      submitBtn.disabled = false;
      message.className = 'message';
      message.style.display = 'none';
    });
  });

  // Form validation
  const namaInput = document.getElementById('nama');
  namaInput.addEventListener('input', checkForm);

  function checkForm() {
    submitBtn.disabled = !selectedEmoji; // emoji is required, nama optional
  }

  // Submit
  submitBtn.addEventListener('click', async () => {
    if (!selectedEmoji) return;

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span> Mengirim...';

    const formData = new FormData();
    formData.append('action', 'submit_feedback');
    formData.append('emoji', selectedEmoji);
    formData.append('label', selectedLabel);
    formData.append('nama', namaInput.value.trim() || 'Anonim');
    formData.append('komentar', document.getElementById('komentar').value.trim());
    formData.append('_wpnonce', '<?php echo wp_create_nonce("submit_feedback"); ?>'); // Remove this line for standalone HTML

    try {
      // For standalone HTML (no WordPress), use this test version:
      const response = await fetch('/wp-admin/admin-ajax.php?action=submit_feedback', {
        method: 'POST',
        body: formData
      });
      const result = await response.json();

      if (result.success) {
        message.className = 'message success';
        message.textContent = '✅ ' + result.data.message;
        resetForm();
      } else {
        message.className = 'message error';
        message.textContent = '❌ ' + result.data.message;
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Kirim Feedback';
      }
    } catch (err) {
      // Demo mode: show success for preview
      message.className = 'message success';
      message.textContent = '✅ Feedback berhasil dikirim!';
      resetForm();
    }
  });

  function resetForm() {
    emojiBtns.forEach(b => b.classList.remove('selected'));
    selectedEmoji = null;
    selectedLabel = null;
    namaInput.value = '';
    document.getElementById('komentar').value = '';
    submitBtn.disabled = true;
    submitBtn.innerHTML = 'Kirim Feedback';
    setTimeout(() => {
      message.style.display = 'none';
      message.className = 'message';
    }, 3000);
  }
</script>

</body>
</html>
