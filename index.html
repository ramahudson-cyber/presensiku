<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#BF00FF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark')</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Urbanist:wght@400;500;600&display=swap" rel="stylesheet">
    <title>Presensiku</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Jaring pengaman white screen: bila module utama gagal dimuat (aset lama
      // hilang setelah deploy / cache SW basi), bersihkan cache & SW lalu reload
      // sekali. Tanpa ini user terkunci di layar putih sampai force-close.
      (function () {
        var reloaded = sessionStorage.getItem("boot-recovered");
        window.addEventListener("error", function (e) {
          var src = e && (e.target && (e.target.src || e.target.href));
          if (!src || String(src).indexOf("/assets/") === -1) return;
          if (reloaded) return;
          sessionStorage.setItem("boot-recovered", "1");
          if (window.caches && caches.keys) {
            caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }).then(function () {
              if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                  regs.forEach(function (r) { r.unregister(); });
                  window.location.reload();
                });
              } else {
                window.location.reload();
              }
            });
          } else {
            window.location.reload();
          }
        }, true);
      })();

      // Auto-reload saat service worker baru mengambil alih halaman. Tanpa ini,
      // PWA standalone (iOS) terus menjalankan versi lama dari cache sampai user
      // force-close & buka ulang app. Guard: hanya bila sebelumnya SUDAH ada
      // controller (bukan kunjungan pertama). Kunci "app-reloaded" dipakai bersama
      // UpdateDialog (jalur webVersionCode) — maksimal SATU reload per cold-open.
      (function () {
        if (!("serviceWorker" in navigator)) return;
        var hadController = !!navigator.serviceWorker.controller;
        var appReloaded = sessionStorage.getItem("app-reloaded");
        navigator.serviceWorker.addEventListener("controllerchange", function () {
          if (!hadController || appReloaded) return;
          sessionStorage.setItem("app-reloaded", "1");
          window.location.reload();
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
